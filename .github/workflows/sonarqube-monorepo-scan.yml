name: SonarQube Scan

on:
  schedule:
    - cron: '15 3,15 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual SonarQube scan'

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  SONAR_HOST_URL: https://sonarqube.mapup.ai

jobs:
  sonarqube-scan:
    name: SonarQube - ${{ matrix.projectKey }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - projectDir: "javascript"
            projectKey: "tolltally-toll-for-route-tomtom-javascript"
            projectStack: "node"
            exclusions: "**/node_modules/**"
            extraArgs: ""
          - projectDir: "python"
            projectKey: "tolltally-toll-for-route-tomtom-python"
            projectStack: "python"
            exclusions: "**/node_modules/**"
            extraArgs: " -Dsonar.python.coverage.reportPaths=**/coverage.xml"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        if: ${{ matrix.projectStack == 'node' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Log manual run reason
        if: github.event_name == 'workflow_dispatch'
        # workflow_dispatch inputs are attacker-supplied text; pass through env
        # rather than interpolating them into the script body.
        env:
          RUN_REASON: ${{ github.event.inputs.reason }}
        run: echo "Manual trigger - $RUN_REASON"

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ matrix.projectDir }}
          args: >
            -Dsonar.projectKey=${{ matrix.projectKey }}
            -Dsonar.sources=.
            -Dsonar.exclusions=${{ matrix.exclusions }}
            ${{ matrix.extraArgs }}

      - name: Update project sheet tab
        if: always()
        continue-on-error: true
        run: |
          sleep 120
          RESPONSE=$(curl -s -L \
            "${{ secrets.APPS_SCRIPT_WEB_APP_URL }}?project=${{ matrix.projectKey }}")
          echo "Sheet update response: $RESPONSE"
          if [ "$RESPONSE" = "ok" ]; then
            echo "✅ Sheet updated successfully for ${{ matrix.projectKey }}"
          else
            echo "⚠️ Sheet update may have failed for ${{ matrix.projectKey }}: $RESPONSE"
          fi
