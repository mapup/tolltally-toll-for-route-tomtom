name: Dependency Track SBOM Scan

# PORTABLE TEMPLATE — copy into
# <your-repo>/.github/workflows/universal-dependency-track.yml as-is;
# nothing repo-specific in it. Identical to
# mapup-security-team/.github/workflows/universal-dependency-track.yml.
#
# Covers TWO of the org's tracked tools in one file: Trivy (generates the
# CycloneDX SBOM in license mode) and Dependency-Track (receives it).
#
# Required secret: DEPENDENCYTRACK_API_KEY

on:
  # No branch filters: repos differ in default-branch names. Pushes are
  # gated to the repo's actual default branch by the job-level `if` below
  # (GitHub trigger filters can't express "the default branch" dynamically);
  # PRs into any branch are scanned.
  push:
    # Non-default-branch pushes are gated off by the job-level `if`
    # anyway; filtering here means they never create a `skipped` run,
    # which the coverage tracker reads as a failed scan.
    branches: [main]
  pull_request:
  schedule:
    # Run daily at 9am UTC
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  dependency-scan:
    # Only default-branch pushes produce the canonical 'main' SBOM upload —
    # feature-branch pushes are skipped rather than overwriting it.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js (if needed)
        if: hashFiles('**/package.json') != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '18'

      - name: Setup Python (if needed)
        if: hashFiles('**/requirements.txt', '**/pyproject.toml', '**/setup.py') != ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Setup Go (if needed)
        if: hashFiles('**/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: Setup Java (if needed)
        if: hashFiles('**/pom.xml', '**/build.gradle', '**/build.gradle.kts') != ''
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies (all languages, including monorepos)
        run: |
          echo "🔍 Detecting and installing dependencies..."

          # Install pnpm if any pnpm-lock.yaml exists (needed for mixed monorepos)
          if find . -name "pnpm-lock.yaml" -not -path "*/node_modules/*" | grep -q .; then
            echo "📦 Installing pnpm globally (detected pnpm projects)"
            npm install -g pnpm
          fi

          # Node.js: Check root first for workspace-level install
          if [ -f "pnpm-lock.yaml" ]; then
            echo "📦 Detected pnpm workspace at root"
            pnpm install --no-frozen-lockfile --ignore-scripts 2>/dev/null || echo "Note: pnpm install failed, continuing..."
          elif [ -f "yarn.lock" ]; then
            echo "📦 Detected yarn workspace at root"
            yarn install --ignore-scripts 2>/dev/null || echo "Note: yarn install failed, continuing..."
          elif [ -f "package-lock.json" ]; then
            echo "📦 Found npm project at root"
            npm ci 2>/dev/null || npm install 2>/dev/null || echo "Note: npm install failed, continuing..."
          elif [ -f "package.json" ]; then
            echo "📦 Found Node.js project at root (no lock file)"
            npm install --package-lock-only 2>/dev/null || echo "Note: npm install failed, continuing..."
          fi

          # Find all subdirectories and install based on their lock files (for mixed monorepos)
          find . -type d -not -path "*/node_modules/*" -not -path "*/.git/*" -not -path "." | while read -r dir; do
            if [ -f "$dir/pnpm-lock.yaml" ]; then
              echo "📦 Found pnpm project in: $dir"
              (cd "$dir" && pnpm install --no-frozen-lockfile --ignore-scripts 2>/dev/null || echo "Note: pnpm install failed in $dir")
            elif [ -f "$dir/yarn.lock" ]; then
              echo "📦 Found yarn project in: $dir"
              (cd "$dir" && yarn install --ignore-scripts 2>/dev/null || echo "Note: yarn install failed in $dir")
            elif [ -f "$dir/package-lock.json" ]; then
              echo "📦 Found npm project in: $dir"
              (cd "$dir" && (npm ci 2>/dev/null || npm install 2>/dev/null || echo "Note: npm install failed in $dir"))
            elif [ -f "$dir/package.json" ]; then
              echo "📦 Found Node.js project in: $dir (no lock file)"
              (cd "$dir" && npm install --package-lock-only 2>/dev/null || echo "Note: npm install failed in $dir")
            fi
          done

          # Python projects
          find . -name "requirements.txt" -not -path "*/.git/*" -not -path "*/venv/*" | while read -r req; do
            dir=$(dirname "$req")
            echo "🐍 Found Python project in: $dir"
            (cd "$dir" && pip install -r requirements.txt 2>/dev/null || echo "Note: pip install failed in $dir")
          done

          # Go projects
          find . -name "go.mod" -not -path "*/.git/*" | while read -r gomod; do
            dir=$(dirname "$gomod")
            echo "🔷 Found Go project in: $dir"
            (cd "$dir" && go mod download 2>/dev/null || echo "Note: go mod download failed in $dir")
          done

          # Java/Maven projects
          find . -name "pom.xml" -not -path "*/.git/*" | while read -r pom; do
            dir=$(dirname "$pom")
            echo "☕ Found Maven project in: $dir"
            (cd "$dir" && mvn dependency:resolve 2>/dev/null || echo "Note: mvn dependency:resolve failed in $dir")
          done

          # Java/Gradle projects
          find . -name "build.gradle*" -not -path "*/.git/*" | while read -r gradle; do
            dir=$(dirname "$gradle")
            echo "☕ Found Gradle project in: $dir"
            (cd "$dir" && (./gradlew dependencies 2>/dev/null || gradle dependencies 2>/dev/null || echo "Note: gradle dependencies failed in $dir"))
          done

          echo "✅ Dependency installation complete"
        continue-on-error: true

      # ── Added 2026-08-27 (license-dashboard triage) ──────────────────────────
      # Trivy's requirements.txt parser only records dependencies pinned with
      # "==". python/requirements.txt in this repo uses ">=" for all three
      # entries (requests, polyline, python-dotenv), so Trivy parsed the file
      # and emitted ZERO Python components — the whole Python dependency tree,
      # direct and transitive, was invisible to the SBOM and to Dependency-Track.
      # That is not visible on the licence dashboard as a finding; it shows up
      # as an absence, which is the more dangerous failure mode.
      #
      # Resolving into a throwaway venv and freezing the result back over the
      # manifest (in the CI workspace only — never committed) gives Trivy the
      # "==" pins it needs, including transitive packages. Verified locally:
      # 0 components before, 6 after, for a 2-line requirements.txt.
      - name: Pin Python manifests for SBOM resolution
        if: hashFiles('**/requirements.txt') != ''
        run: |
          set -u
          find . -name requirements.txt -not -path "*/.git/*" -not -path "*/node_modules/*" \
                 -not -path "*/venv/*" -not -path "*/.venv/*" | while read -r req; do
            dir=$(dirname "$req")
            echo "🐍 Pinning $req"
            rm -rf /tmp/sbomvenv
            if ! python3 -m venv /tmp/sbomvenv; then
              echo "   ⚠️  could not create venv — leaving $req unpinned"
              continue
            fi
            if ! /tmp/sbomvenv/bin/pip install -q --disable-pip-version-check -r "$req"; then
              echo "   ⚠️  pip install failed — leaving $req unpinned so the"
              echo "      original (unresolved) manifest is still scanned."
              continue
            fi
            /tmp/sbomvenv/bin/pip freeze --exclude-editable \
              | grep -vE '^(pip|setuptools|wheel|pkg[-_]resources)==' > "$req.pinned"
            if [ -s "$req.pinned" ]; then
              mv "$req.pinned" "$req"
              echo "   ✅ pinned $(wc -l < "$req") packages"
            else
              rm -f "$req.pinned"
              echo "   ⚠️  freeze produced nothing — left unpinned"
            fi
          done
          rm -rf /tmp/sbomvenv

      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          format: cyclonedx
          output: bom-raw.json
          scanners: license
          license-full: true
          # Java build files vendored INSIDE an npm package are not dependencies
          # we resolve. serverless ships a Java runtime wrapper at
          # node_modules/serverless/lib/plugins/aws/invoke-local/runtime-wrappers/java/pom.xml;
          # Trivy parsed it and emitted 9 phantom Maven components
          # (com.serverless:invoke-bridge plus the jackson/joda-time/aws-lambda
          # deps it declares). None are installed, none are on Maven Central,
          # and invoke-bridge has no licence — so it surfaced as an unresolvable
          # "No License Metadata" finding on something we do not ship.
          # Verified: this removes exactly those 9 and leaves all 1692 npm
          # components untouched.
          skip-files: '**/node_modules/**/pom.xml'

      # ── Why this step changed (2026-08-27, license-dashboard triage) ─────────
      # Trivy emits the *manifest it scanned* as a component. When the manifest
      # is not at the repo root it is emitted PATH-PREFIXED — "ruby/Gemfile.lock",
      # "polygons_monitor/requirements.txt", "cloudwatch_loggroup_retention/go.mod".
      # The previous filter compared `.name` against bare filenames ("go.mod"),
      # so it only ever stripped root-level manifests and every nested one
      # survived into Dependency-Track as a HIGH "No License Metadata" finding.
      # In this repo that was `ruby/Gemfile.lock` — 1 of the 3 HIGH findings on
      # the org licence sheet, and not a real package at all.
      # Matching on the basename fixes it. Dropped entries are printed rather
      # than silently discarded, so an over-broad filter is visible in the log.
      - name: Clean and validate SBOM
        run: |
          echo "🧹 Cleaning SBOM (removing manifest/lock pseudo-components)..."
          jq '
            def basename: split("/") | last;
            [
              "package-lock.json","npm-shrinkwrap.json","yarn.lock","pnpm-lock.yaml",
              "go.mod","go.sum","uv.lock","poetry.lock","Pipfile","Pipfile.lock",
              "requirements.txt","requirements-dev.txt","setup.py","pyproject.toml",
              "Cargo.lock","composer.lock","Gemfile","Gemfile.lock",
              "packages.config","packages.lock.json","gradle.lockfile","pom.xml"
            ] as $manifests
            | .components |= ((. // []) | map(
                . as $c
                | ($c.name | basename) as $b
                | if ($manifests | index($b))
                     or ($b | test("(\\.lock|lock\\.json)$"; "i"))
                  then $c + {__drop: "manifest/lock pseudo-component"}
                  elif ($c.version // "") == ""
                  then $c + {__drop: "versionless pseudo-component (module root)"}
                  else $c end
              ))
          ' bom-raw.json > bom-marked.json

          echo "   dropped:"
          jq -r '.components[] | select(.__drop) | "     - \(.name)  [\(.__drop)]"' bom-marked.json
          jq '.components |= (map(select(.__drop | not)) | map(del(.__drop)))' bom-marked.json > bom.json
          rm -f bom-marked.json

          if [ ! -s bom.json ]; then
            echo "❌ Error: cleaned SBOM is empty or missing"
            exit 1
          fi

      # ── Added 2026-08-27 ─────────────────────────────────────────────────────
      # Trivy resolves licences from manifests, not from installed packages.
      # Two ecosystems in this repo therefore come back blank no matter what:
      #   * ruby/Gemfile.lock carries no licence data at all  -> fast-polylines
      #   * npm packages that omit "license" in package.json  -> polyline@0.2.0
      # Both are permissive in reality (MIT and BSD-3-Clause; verified against
      # rubygems.org and the package's own LICENSE file). They accounted for the
      # other 2 of this repo's 3 HIGH findings. The enrichment script resolves
      # them from the upstream registries and falls back to a curated, commented
      # map. It never invents a licence: anything it cannot resolve stays blank
      # and is listed for manual review.
      - name: Enrich missing licences in SBOM
        run: python3 scripts/enrich-licenses.py --bom bom.json

      - name: Print SBOM statistics
        run: |
          echo "📊 SBOM Statistics:"
          jq '{
              totalComponents: (.components | length),
              componentsWithLicenses: ([.components[] | select(.licenses)] | length),
              componentsMissingLicenses: ([.components[] | select(.licenses | not)] | length)
          }' bom.json

      - name: Check Dependency-Track credentials
        id: dt_check
        env:
          DEPENDENCYTRACK_API_KEY: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
        run: |
          if [ -n "$DEPENDENCYTRACK_API_KEY" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "DEPENDENCYTRACK_API_KEY not set — Dependency-Track upload will be skipped."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload BOM to Dependency-Track
        # Two reasons this must not run on pull requests:
        #  1. projectversion below is hardcoded to the default branch, so a PR
        #     upload overwrites the default-branch SBOM in Dependency-Track
        #     with the contents of an unmerged branch.
        #  2. dependabot-triggered runs get no secrets, so the API key is empty
        #     and the upload 401s — failing a job whose scan actually succeeded.
        if: github.event_name != 'pull_request' && steps.dt_check.outputs.upload == 'true'
        uses: DependencyTrack/gh-upload-sbom@95c2b5a810450509ef8a67e4f854b42d2ddf7fbf # v4.1.0
        with:
          # Switched to the TLS endpoint 2026-08-27, now that engineering-utils,
          # navguru-mobile-app and polyline are all confirmed using it.
          serverhostname: 'deptrack-api.mapup.ai'
          port: '443'
          protocol: 'https'
          apikey: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
          projectname: ${{ github.event.repository.name }}
          projectversion: 'main'
          bomfilename: 'bom.json'
          autocreate: 'true'

      - name: Archive SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sbom-cyclonedx
          path: bom.json
          retention-days: 90
